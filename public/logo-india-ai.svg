<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xml:space="preserve">
  <defs>
    <!-- Saffron to Green Gradient -->
    <linearGradient id="indiaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>

    <!-- Saffron Glow Gradient -->
    <radialGradient id="saffronGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0"/>
    </radialGradient>

    <!-- Neural Network Pattern -->
    <pattern id="neuralPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="3" fill="#FF9933" opacity="0.6"/>
      <circle cx="0" cy="0" r="2" fill="#138808" opacity="0.4"/>
      <circle cx="40" cy="0" r="2" fill="#138808" opacity="0.4"/>
      <circle cx="0" cy="40" r="2" fill="#138808" opacity="0.4"/>
      <circle cx="40" cy="40" r="2" fill="#138808" opacity="0.4"/>
      <line x1="20" y1="20" x2="0" y2="0" stroke="#FF9933" stroke-width="1" opacity="0.3"/>
      <line x1="20" y1="20" x2="40" y2="0" stroke="#FF9933" stroke-width="1" opacity="0.3"/>
      <line x1="20" y1="20" x2="0" y2="40" stroke="#FF9933" stroke-width="1" opacity="0.3"/>
      <line x1="20" y1="20" x2="40" y2="40" stroke="#FF9933" stroke-width="1" opacity="0.3"/>
    </pattern>

    <!-- Chakra Design -->
    <g id="chakra">
      <circle cx="100" cy="100" r="35" fill="none" stroke="#FF9933" stroke-width="2"/>
      <circle cx="100" cy="100" r="30" fill="none" stroke="#FF9933" stroke-width="1" opacity="0.5"/>
      <g id="spokes">
        <line x1="100" y1="70" x2="100" y2="130" stroke="#FF9933" stroke-width="1.5"/>
        <line x1="70" y1="100" x2="130" y2="100" stroke="#FF9933" stroke-width="1.5"/>
        <line x1="78.8" y1="78.8" x2="121.2" y2="121.2" stroke="#FF9933" stroke-width="1.5"/>
        <line x1="121.2" y1="78.8" x2="78.8" y2="121.2" stroke="#FF9933" stroke-width="1.5"/>
        <line x1="100" y1="75" x2="100" y2="85" stroke="#FF9933" stroke-width="2"/>
        <line x1="100" y1="115" x2="100" y2="125" stroke="#FF9933" stroke-width="2"/>
        <line x1="75" y1="100" x2="85" y2="100" stroke="#FF9933" stroke-width="2"/>
        <line x1="115" y1="100" x2="125" y2="100" stroke="#FF9933" stroke-width="2"/>
      </g>
    </g>
  </defs>

  <!-- Background Circle with Neural Pattern -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0f"/>
  <circle cx="100" cy="100" r="95" fill="url(#neuralPattern)" opacity="0.3"/>

  <!-- Outer Ring with Gradient -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#indiaGradient)" stroke-width="3"/>

  <!-- Decorative Elements -->
  <circle cx="100" cy="15" r="4" fill="#FF9933" opacity="0.8"/>
  <circle cx="185" cy="100" r="4" fill="#138808" opacity="0.8"/>
  <circle cx="100" cy="185" r="4" fill="#FF9933" opacity="0.8"/>
  <circle cx="15" cy="100" r="4" fill="#138808" opacity="0.8"/>

  <!-- Main Chakra Symbol -->
  <use href="#chakra"/>

  <!-- AI Node Network Overlay -->
  <g class="ai-network">
    <circle cx="100" cy="100" r="8" fill="#FF9933"/>
    <circle cx="100" cy="60" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="140" cy="100" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="100" cy="140" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="60" cy="100" r="5" fill="#FFFFFF" opacity="0.8"/>
    <line x1="100" y1="100" x2="100" y2="60" stroke="#FF9933" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="100" x2="140" y2="100" stroke="#FF9933" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="100" x2="100" y2="140" stroke="#FF9933" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="100" x2="60" y2="100" stroke="#FF9933" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Text "IB" Monogram -->
  <text x="100" y="108" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" opacity="0.9">IB</text>

  <!-- Outer Glow Effect -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="url(#saffronGlow)" stroke-width="2" opacity="0.5"/>
</svg>
