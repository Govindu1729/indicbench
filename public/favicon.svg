
<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xml:space="preserve">
  <defs>
    <!-- Saffron Gradient -->
    <linearGradient id="iconSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FFB366"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0a0f"/>

  <!-- Outer Ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#iconSaffron)" stroke-width="2.5"/>

  <!-- Chakra Spokes -->
  <g transform="translate(32, 32)">
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#FF9933" stroke-width="1.5"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#FF9933" stroke-width="1.5"/>
    <line x1="-14.1" y1="-14.1" x2="14.1" y2="14.1" stroke="#FF9933" stroke-width="1.5"/>
    <line x1="14.1" y1="-14.1" x2="-14.1" y2="14.1" stroke="#FF9933" stroke-width="1.5"/>
  </g>

  <!-- Inner Circle -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

  <!-- Central AI Node -->
  <circle cx="32" cy="32" r="7" fill="#FF9933" filter="url(#iconGlow)"/>

  <!-- Network Nodes -->
  <circle cx="32" cy="18" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="46" cy="32" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="32" cy="46" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="18" cy="32" r="3" fill="#FFFFFF" opacity="0.9"/>

  <!-- Connection Lines -->
  <line x1="32" y1="32" x2="32" y2="18" stroke="#FF9933" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="32" x2="46" y2="32" stroke="#FF9933" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="32" x2="32" y2="46" stroke="#FF9933" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="32" x2="18" y2="32" stroke="#FF9933" stroke-width="1.5" opacity="0.7"/>
</svg>
