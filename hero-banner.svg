
<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" xml:space="preserve">
  <defs>
    <!-- India Flag Gradient -->
    <linearGradient id="tricolorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="33%" stop-color="#FF9933"/>
      <stop offset="33%" stop-color="#FFFFFF"/>
      <stop offset="66%" stop-color="#FFFFFF"/>
      <stop offset="66%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>

    <!-- Modern Gradient -->
    <linearGradient id="modernGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FFCC99"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Mesh Pattern -->
    <pattern id="meshPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M0,25 L50,25 M25,0 L25,50" stroke="#FF9933" stroke-width="0.5" opacity="0.3"/>
      <circle cx="25" cy="25" r="3" fill="#FF9933" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#0a0a0f"/>

  <!-- Decorative Mesh Background -->
  <rect width="400" height="300" fill="url(#meshPattern)" opacity="0.2"/>

  <!-- Abstract Map of India (Simplified) -->
  <g transform="translate(200, 150)" opacity="0.15">
    <path d="M-80,-60 Q-50,-80 -20,-70 Q10,-90 40,-70 Q70,-60 80,-30 Q90,0 70,30 Q50,60 20,80 Q-10,90 -40,70 Q-70,50 -90,20 Q-100,-10 -80,-60"
          fill="url(#tricolorGrad)" stroke="#FF9933" stroke-width="1"/>
  </g>

  <!-- Central Chakra Emblem -->
  <g transform="translate(200, 130)">
    <!-- Outer Rings -->
    <circle r="70" fill="none" stroke="url(#modernGrad)" stroke-width="3" filter="url(#softGlow)"/>
    <circle r="60" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    <circle r="50" fill="none" stroke="#FF9933" stroke-width="1" opacity="0.4"/>

    <!-- Ashoka Chakra with 24 spokes (simplified to 12 for clarity) -->
    <g transform="rotate(0)">
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#FF9933" stroke-width="2"/>
      <line x1="-43.3" y1="-25" x2="43.3" y2="25" stroke="#FF9933" stroke-width="2"/>
      <line x1="-43.3" y1="25" x2="43.3" y2="-25" stroke="#FF9933" stroke-width="2"/>
      <line x1="-25" y1="-43.3" x2="25" y2="43.3" stroke="#FF9933" stroke-width="2"/>
      <line x1="-25" y1="43.3" x2="25" y2="-43.3" stroke="#FF9933" stroke-width="2"/>
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#FF9933" stroke-width="2"/>
    </g>

    <!-- Central Hub -->
    <circle r="12" fill="#FF9933" filter="url(#softGlow)"/>
    <circle r="6" fill="#FFFFFF"/>
  </g>

  <!-- AI Neural Network Overlay -->
  <g transform="translate(200, 130)">
    <!-- Network Nodes -->
    <circle cx="0" cy="-80" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="70" cy="-40" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="70" cy="40" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="0" cy="80" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-70" cy="40" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-70" cy="-40" r="6" fill="#FFFFFF" opacity="0.9"/>

    <!-- Connection Lines -->
    <path d="M0,-80 L70,-40 L70,40 L0,80 L-70,40 L-70,-40 Z"
          fill="none" stroke="#FF9933" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#FF9933" stroke-width="1.5" opacity="0.4"/>
    <line x1="-70" y1="-40" x2="70" y2="40" stroke="#FF9933" stroke-width="1.5" opacity="0.4"/>
    <line x1="-70" y1="40" x2="70" y2="-40" stroke="#FF9933" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Text "IndicBench" -->
  <text x="200" y="230" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="700"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="2">INDICBENCH</text>

  <!-- Tagline -->
  <text x="200" y="255" font-family="'Geist Mono', 'Courier New', monospace" font-size="11"
        fill="#8b8b9e" text-anchor="middle" letter-spacing="3">INDIA'S AI BENCHMARK SUITE</text>

  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="3" fill="#FF9933" opacity="0.6"/>
  <circle cx="350" cy="50" r="3" fill="#138808" opacity="0.6"/>
  <circle cx="50" cy="250" r="3" fill="#138808" opacity="0.6"/>
  <circle cx="350" cy="250" r="3" fill="#FF9933" opacity="0.6"/>

  <!-- Tricolor Accent Lines -->
  <line x1="100" y1="280" x2="300" y2="280" stroke="#FF9933" stroke-width="2"/>
  <line x1="100" y1="285" x2="300" y2="285" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="100" y1="290" x2="300" y2="290" stroke="#138808" stroke-width="2"/>
</svg>
